<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What’s Your Drift Risk Score? | Leadership Drift</title>
<meta name="description" content="A 2-minute diagnostic from the book Leadership Drift by Kristen Peloquin. Find out which leadership trap is quietly draining your team — and the first move to fix it.">
<style>
  :root{
    --navy:#16283f; --navy2:#1f3a5c; --gold:#d9a441; --gold2:#b9862f;
    --ink:#232a35; --muted:#5d6b7f; --line:#e3e8ef; --bg:#f6f8fb; --card:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; padding:24px 16px;}
  .wrap{max-width:640px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:32px 28px; box-shadow:0 6px 24px rgba(22,40,63,.07);}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold2); font-weight:700; margin-bottom:10px;}
  h1{font-size:28px; line-height:1.25; color:var(--navy); margin-bottom:12px;}
  h2{font-size:22px; color:var(--navy); margin-bottom:10px;}
  p{margin-bottom:14px; color:var(--ink);}
  .sub{color:var(--muted); font-size:16px;}
  .btn{display:inline-block; background:var(--gold); color:#16283f; font-weight:700;
    border:none; border-radius:10px; padding:14px 26px; font-size:16px; cursor:pointer;
    text-decoration:none; transition:background .15s;}
  .btn:hover{background:var(--gold2); color:#fff;}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:600;}
  .btn.ghost:hover{border-color:var(--muted); color:var(--ink); background:transparent;}
  .center{text-align:center;}
  .progress{height:8px; background:var(--line); border-radius:99px; margin-bottom:22px; overflow:hidden;}
  .progress > div{height:100%; background:var(--gold); border-radius:99px; transition:width .25s;}
  .qnum{font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .qtext{font-size:19px; font-weight:700; color:var(--navy); margin-bottom:18px;}
  .ans{display:block; width:100%; text-align:left; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:14px 16px;
    font-size:15.5px; margin-bottom:10px; cursor:pointer; color:var(--ink); transition:border .12s, background .12s;}
  .ans:hover{border-color:var(--gold); background:#fff;}
  .tag{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:#fff; background:var(--navy2);
    padding:5px 12px; border-radius:99px; margin-bottom:12px;}
  .trapills{margin:14px 0;}
  .trapills span{display:inline-block; background:#eef3f9; color:var(--navy2);
    font-size:13px; font-weight:600; padding:5px 12px; border-radius:99px; margin:0 6px 6px 0;}
  .move{background:#fdf6e7; border-left:4px solid var(--gold); padding:14px 16px;
    border-radius:0 10px 10px 0; margin:16px 0; font-size:15px;}
  .move strong{color:var(--navy);}
  .cta-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .bars{margin:16px 0;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13.5px;}
  .bar-row .lbl{width:92px; font-weight:700; color:var(--navy); flex-shrink:0;}
  .bar-track{flex:1; height:10px; background:var(--line); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--navy2); border-radius:99px;}
  .bar-row.top .bar-fill{background:var(--gold);}
  .score-big{font-size:72px; font-weight:800; color:var(--navy); line-height:1; margin:6px 0 2px;}
  .score-big span{font-size:22px; font-weight:600; color:var(--muted);}
  .bar-row .pct{width:36px; text-align:right; color:var(--muted); flex-shrink:0;}
  input[type=email]{width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; margin-bottom:12px;}
  .fine{font-size:13px; color:var(--muted);}
  .foot{margin-top:22px; text-align:center; font-size:13px; color:var(--muted);}
  .foot a{color:var(--navy2);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"><!-- rendered by JS --></div>
  <div class="foot">
    From the book <em>Leadership Drift</em> by Kristen Peloquin ·
    <a href="https://klpconsultingsvcs.org">klpconsultingsvcs.org</a>
  </div>
</div>

<script>
/* ============================================================
   QUIZ DATA — twelve statements scored 3/2/1/0, summed to a 0–100
   Drift Risk Score; per-section subscores name the biggest leak.
   ============================================================ */
const QUESTIONS = [
  { q:"Important work waits until a specific person is available.", k:"rescuer" },
  { q:"People describe the culture as \u201cnice\u201d but not honest.", k:"avoider" },
  { q:"Saying no to new work feels politically impossible.", k:"overloader" },
  { q:"Customers experience the seams between your departments.", k:"silo" },
  { q:"Problems get solved faster by escalation than by process.", k:"rescuer" },
  { q:"The same personnel issue has been discussed for months without action.", k:"avoider" },
  { q:"The team hits its targets but looks exhausted doing it.", k:"overloader" },
  { q:"Each leader can recite their own goals but not the company\u2019s.", k:"silo" },
  { q:"You can feel the difference on days the key leader is out.", k:"rescuer" },
  { q:"Bad news travels slowly here.", k:"avoider" },
  { q:"Nobody can name what got deprioritized this quarter.", k:"overloader" },
  { q:"Cross-functional projects need an executive sponsor to move.", k:"silo" }
];

const RESULTS = {
  rescuer:{ name:"The Rescuer",
    tagline:"Your team doesn't have an execution problem. It has a you problem.",
    desc:"You're the charismatic center of the operation. Decisions flow through you, live rescues feel good, and the team has learned that waiting for you is smarter than deciding without you. It worked — until the organization outgrew your calendar.",
    traps:["Charisma Dependency Cycle","Leadership Bottleneck","Hero Façade"],
    cost:"Learned helplessness, stalled decisions whenever you're unavailable, and you as the single point of failure.",
    move:"Install a Decision Architecture. This week, publish one decision boundary in plain language: what the frontline can decide without you, and what must be escalated. Then refuse the next rescue.",
    chapters:"Chapters 1–5" },
  avoider:{ name:"The Avoider",
    tagline:"Your culture isn't broken. It's just never been told the truth.",
    desc:"Hard conversations keep getting postponed — the feedback, the tolerance of mediocrity, the conflict between peers. Every delay feels kinder in the moment. Every delay compounds like debt.",
    traps:["Avoidance Debt Trap","Illusion of Kindness","Tolerance Trade Trap","Triangulation Trap"],
    cost:"Surprise terminations, festering conflict, and standards that quietly become optional.",
    move:"Install the Accountability Loop. Reinstate weekly 1-on-1s that can be rescheduled but never canceled, and start a written feedback log — one email after every hard conversation.",
    chapters:"Chapters 6–9" },
  overloader:{ name:"The Overloader",
    tagline:"Your team isn't lazy. It's buried.",
    desc:"Everything is priority one, the dashboard is green while the team drowns in workarounds, and your most reliable people are rewarded with more work. Burnout here isn't a hours problem — it's a design problem.",
    traps:["Ambiguity Burnout Trap","Reliability Tax Trap","Green Dashboard Trap","Capacity Mirage"],
    cost:"Quiet quitting from your best people, rework, and a team that confuses motion with progress.",
    move:"Install the Capacity Blueprint. Use the Priority Kill Switch: for every new initiative added, one of equal weight gets explicitly paused or killed. No ties allowed.",
    chapters:"Chapters 10–14" },
  silo:{ name:"The Silo Builder",
    tagline:"Your departments are winning. Your company is losing.",
    desc:"Each function optimizes for its own scorecard while the handoffs between them — where the customer actually lives — go undefined. Turf gets defended, peers fail separately, and open roles get filled in panic.",
    traps:["Turf War","Protecting Your Silo","Re-Org Void Trap","Pressure Hiring Trap"],
    cost:"Dropped handoffs, duplicated work, and customers caught in the gap between departments.",
    move:"Install the Rules of Engagement. Give your two most frictional departments one shared KPI they win or lose together, and write their internal SLA on a single page.",
    chapters:"Chapters 15–19" }
};
const ORDER = ["rescuer","avoider","overloader","silo"];
const LABELS = {rescuer:"Rescue risk", avoider:"Accountability risk", overloader:"Capacity risk", silo:"Silo risk"};

// LEAD CAPTURE (Web3Forms -> kristen@klpconsultingsvcs.org)
const WEB3FORMS_ACCESS_KEY = "ee876766-2b71-4ab8-888b-6cb3f57d469d";

let state = { step:0, scores:{rescuer:0, avoider:0, overloader:0, silo:0}, email:"" };
const app = document.getElementById("app");

function renderStart(){
  app.innerHTML =
    '<div class="kicker">Leadership Drift · 2-minute diagnostic</div>'+
    '<h1>What’s your drift risk score?</h1>'+
    '<p class="sub">Leadership drift rarely announces itself as failure. Twelve statements. One number. Rate how often each happens on your team and get your Drift Risk Score — a 0–100 read on how far your operation has slid — plus where the leak is worst and the first move to fix it.</p>'+
    '<p class="sub">Based on <em>Leadership Drift</em> by Kristen Peloquin.</p>'+
    '<div class="center" style="margin-top:8px;"><button class="btn" onclick="renderQ()">Start the diagnostic</button></div>';
}

function renderQ(){
  const i = state.step, total = QUESTIONS.length;
  if(i >= total){ renderGate(); return; }
  const Q = QUESTIONS[i];
  let html = '<div class="progress"><div style="width:'+Math.round(i/total*100)+'%"></div></div>'+
    '<div class="qnum">Statement '+(i+1)+' of '+total+'</div>'+
    '<div class="qtext">'+Q.q+'</div>'+
    '<div class="fine" style="margin-bottom:14px;">How often does this happen on your team?</div>';
  var SCALE = [["Always",3],["Often",2],["Sometimes",1],["Rarely",0]];
  SCALE.forEach(function(s2){
    html += '<button class="ans" onclick="answer(\''+Q.k+'\','+s2[1]+')">'+s2[0]+'</button>';
  });
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function answer(key,val){ state.scores[key]+=val; state.step++; renderQ(); }

function topKey(){
  let best = ORDER[0];
  ORDER.forEach(function(k){ if(state.scores[k] > state.scores[best]) best = k; });
  return best;
}

function renderGate(){
  /* EMAIL GATE — connect this form to your email provider (ConvertKit,
     Mailchimp, etc.) or your site's form handler to capture leads.
     The result renders either way; the email is optional. */
  app.innerHTML =
    '<div class="progress"><div style="width:100%"></div></div>'+
    '<div class="kicker">Almost there</div>'+
    '<h2>Get your full risk report</h2>'+
    '<p class="sub">Enter your email and we\'ll send your result plus the free operating frameworks from the book — the Decision Architecture Matrix, the Priority Kill Switch, the 48-Hour Feedback Log, and the Seam Handoff Standard.</p>'+
    '<input type="email" id="email" placeholder="you@company.com">'+
    '<div class="cta-row"><button class="btn" onclick="submitEmail()">Send my report</button>'+
    '<button class="btn ghost" onclick="renderResult()">Skip — just show my result</button></div>'+
    '<p class="fine" style="margin-top:12px;">No spam. Unsubscribe anytime.</p>';
}
function submitEmail(){
  const v = (document.getElementById("email").value || "").trim();
  if(v && v.indexOf("@") < 0){ alert("Please enter a valid email address."); return; }
  state.email = v;
  if(v) {
    try {
      localStorage.setItem("klp_quiz_lead_email", v);
      localStorage.setItem("klp_quiz_last_submission", JSON.stringify({
        quiz: document.title,
        date: new Date().toISOString(),
        email: v,
        scores: state.scores
      }));
    } catch(e) {}

    if (typeof WEB3FORMS_ACCESS_KEY !== "undefined" && WEB3FORMS_ACCESS_KEY && WEB3FORMS_ACCESS_KEY !== "ee876766-2b71-4ab8-888b-6cb3f57d469d") {
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          access_key: WEB3FORMS_ACCESS_KEY,
          subject: "New Quiz Lead: " + (document.title || "Leadership Drift Risk Score Quiz"),
          from_name: "Leadership Drift Quiz",
          email: v,
          quiz_name: document.title || "Leadership Drift Risk Score Quiz",
          scores_breakdown: JSON.stringify(state.scores),
          submitted_at: new Date().toLocaleString()
        })
      }).catch(function(e) {});
    }
  }
  renderResult();
}

function renderResult(){
  const S = state.scores;
  const total = S.rescuer + S.avoider + S.overloader + S.silo;
  const score = Math.round(total/36*100);
  const leak = topKey();
  const SEC = {
    rescuer:{name:"Rescue dependency", move:"Publish one decision boundary this week: three things your frontline can decide without you. Then refuse the next rescue."},
    avoider:{name:"Avoided accountability", move:"Reinstate weekly 1-on-1s that can be rescheduled but never canceled. Start a written feedback log this week."},
    overloader:{name:"Overload", move:"Run the Priority Kill Switch: for the next initiative added, one of equal weight gets explicitly paused or killed."},
    silo:{name:"Silo friction", move:"Give your two most frictional departments one shared KPI they win or lose together. Write their internal SLA on a single page."}
  };
  const BANDS = [
    {max:25, tag:"Low drift risk", name:"Anchored",
     desc:"Drift hasn\u2019t taken hold. Decisions move, feedback flows, capacity is honest, and handoffs hold. Your job now is maintenance \u2014 run a quarterly drift check and don\u2019t let a good quarter make you sloppy."},
    {max:50, tag:"The slide has started", name:"Early Drift",
     desc:"The operation still works, but the warning lights are on. One or two sections are sliding. This is the cheapest moment to fix it \u2014 later, it costs people."},
    {max:75, tag:"Multiple systems failing", name:"Deep Drift",
     desc:"This isn\u2019t a rough patch, it\u2019s a pattern. Several sections are sliding at once, and the failures interact: overloaded teams avoid hard conversations, siloed departments escalate everything to you. You need systems now, not effort."},
    {max:100, tag:"Running on heroics", name:"Critical Drift",
     desc:"The operation is being held together by individual heroics, not systems. Your best people are burning out, decisions stall without you, and the customer is feeling the seams. Start with the biggest leak below \u2014 this week."}
  ];
  let band = BANDS[3];
  for(let i=0;i<BANDS.length;i++){ if(score <= BANDS[i].max){ band = BANDS[i]; break; } }
  let bars = "";
  ORDER.forEach(function(k){
    const pct = Math.round(S[k]/9*100);
    bars += '<div class="bar-row'+(k===leak?' top':'')+'"><div class="lbl">'+LABELS[k]+
      '</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="pct">'+pct+'%</div></div>';
  });
  app.innerHTML =
    '<div class="tag">'+band.tag+'</div>'+
    '<div class="score-big">'+score+'<span>/100</span></div>'+
    '<h1>'+band.name+'</h1>'+
    '<p>'+band.desc+'</p>'+
    '<div class="move"><strong>Your biggest leak: '+SEC[leak].name+'.</strong><br>'+SEC[leak].move+'</div>'+
    '<div class="kicker" style="margin-top:18px;">Where the risk concentrates</div>'+
    '<div class="bars">'+bars+'</div>'+
    '<div class="cta-row">'+
      '<a class="btn" href="https://klpconsultingsvcs.org/tools.html">Get the free frameworks</a>'+
      '<a class="btn ghost" href="https://klpconsultingsvcs.org">Fix this with your team</a>'+
    '</div>'+
    '<p class="fine" style="margin-top:14px;">Want to fix this across your whole leadership team? '+
    '<a href="https://klpconsultingsvcs.org">Ask about the Enterprise Edition</a> \u2014 the 4-week playbook sprint, guided sessions, and implementation support.</p>'+
    '<div class="center" style="margin-top:10px;"><button class="btn ghost" onclick="reset()">Retake</button></div>';
  window.scrollTo(0,0);
}
function reset(){ state = { step:0, scores:{rescuer:0, avoider:0, overloader:0, silo:0}, email:"" }; renderStart(); }

renderStart();
</script>
</body>
</html>
